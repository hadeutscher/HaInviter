name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless in CI and only slow the cache down.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-24.04-arm

    # The end-to-end test drops and recreates this database's schema, so it gets
    # one of its own rather than the variable the application reads.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hainviter_test
          POSTGRES_USER: hainviter
          POSTGRES_PASSWORD: hainviter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hainviter -d hainviter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only to put rustup on PATH: the channel, its components and the wasm
      # target all come from rust-toolchain.toml, which rustup applies to every
      # cargo call regardless of what is installed here.
      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup | Cache
        uses: Swatinem/rust-cache@v2

      - name: Check | Formatting
        run: cargo fmt --all --check

      # dev-db is included so the development helper is linted too; without it
      # `required-features` excludes that target and it would rot unnoticed.
      - name: Check | Clippy (server)
        run: cargo clippy --features server,dev-db --all-targets -- -D warnings

      # The client half of the app only exists on wasm32, so it needs its own
      # pass: a change that breaks the browser build compiles fine natively.
      - name: Check | WASM client
        run: cargo check --features web --target wasm32-unknown-unknown

      - name: Test
        env:
          HAINVITER_TEST_DATABASE_URL: postgres://hainviter:hainviter@localhost:5432/hainviter_test
          # Turns a broken database service into a failure rather than a
          # silently skipped end-to-end test.
          HAINVITER_REQUIRE_DB: "1"
        run: cargo test --features server --no-fail-fast
