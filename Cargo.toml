[package]
name = "hainviter"
version = "0.1.0"
authors = ["Yuval Deutscher"]
edition = "2024"
description = "Guest invitation and RSVP management for weddings, parties and other events"
repository = "https://github.com/hadeutscher/HaInviter"
publish = false

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
# `--features web`    builds the WASM browser bundle (driven by `dx`).
# `--features server` builds the native Axum server binary.
[features]
default = []
web = ["dioxus/web"]
# Development only: builds the `devdb` helper below. Never enabled for the
# container image, so neither PostgreSQL's binaries nor the machinery that
# downloads them reach production.
dev-db = ["dep:postgresql_embedded", "dep:tokio", "tokio/signal"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:deadpool-postgres",
    "dep:getrandom",
    "dep:phonenumber",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-postgres",
]

[dependencies]
axum = { version = "0.8", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
deadpool-postgres = { version = "0.14", default-features = false, features = [
    "rt_tokio_1",
], optional = true }
dioxus = { version = "0.7", features = ["fullstack", "router"] }
getrandom = { version = "0.3", optional = true }
# libphonenumber's metadata, so a number written the way a contact card happens
# to spell it normalises correctly for every country rather than for one guessed
# one. Server-only on purpose: that metadata dwarfs the rest of the WASM bundle.
phonenumber = { version = "0.3", optional = true }
# rustls rather than the default native-tls: a development helper must not
# require a system OpenSSL on every contributor's machine.
postgresql_embedded = { version = "0.21", default-features = false, features = [
    "tls-rustls-ring",
    "tokio",
    "zonky",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
# No TLS: the database is reached over the cluster's own network, and pulling in
# a TLS stack for that would be the largest dependency in the tree.
tokio-postgres = { version = "0.7", optional = true }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
], optional = true }
# Percent-encoding for the pre-filled share text, which is frequently Hebrew.
# Shared by both builds, and small enough not to matter to either.
urlencoding = "2"

# ---------------------------------------------------------------------------
# Browser-only dependencies
# ---------------------------------------------------------------------------
# The seating chart is a GPU canvas driven by haboard, which needs winit for the
# event loop and web-sys to rasterise the guest tokens with the browser's own
# text engine. None of it exists on the server, so it is scoped to the WASM
# target rather than to the `web` feature: that way `cargo check` and the test
# suite never build a GPU stack they cannot use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Default features off: those are the winit adapter and the application shell,
# and the chart is a control inside a page that already owns its event loop.
# Turning them off keeps winit out of the dependency graph entirely.
haboard = { version = "0.2", default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "AddEventListenerOptions",
    "CanvasRenderingContext2d",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "ImageData",
    "KeyboardEvent",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverOptions",
    "ResizeObserverSize",
    "Window",
]


# Declared explicitly so the development helper can require its own feature:
# without that, `cargo build` on a fresh checkout would try to compile it.
[[bin]]
name = "hainviter"
path = "src/main.rs"

[[bin]]
name = "devdb"
path = "src/bin/devdb.rs"
required-features = ["dev-db"]

# Lean release profile: this runs on a Raspberry Pi, so trade build time for a
# smaller, faster binary. `strip` keeps the image small.
[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = true
