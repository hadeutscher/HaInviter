[package]
name = "hainviter"
version = "0.1.0"
authors = ["Yuval Deutscher"]
edition = "2024"
description = "Guest invitation and RSVP management for weddings, parties and other events"
repository = "https://github.com/hadeutscher/HaInviter"
publish = false

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
# `--features web`    builds the WASM browser bundle (driven by `dx`).
# `--features server` builds the native Axum server binary.
[features]
default = []
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:deadpool-postgres",
    "dep:getrandom",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-postgres",
]

[dependencies]
axum = { version = "0.8", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
deadpool-postgres = { version = "0.14", default-features = false, features = [
    "rt_tokio_1",
], optional = true }
dioxus = { version = "0.7", features = ["fullstack", "router"] }
getrandom = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
# No TLS: the database is reached over the cluster's own network, and pulling in
# a TLS stack for that would be the largest dependency in the tree.
tokio-postgres = { version = "0.7", optional = true }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
], optional = true }

# Lean release profile: this runs on a Raspberry Pi, so trade build time for a
# smaller, faster binary. `strip` keeps the image small.
[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = true
